# ===================================================================
# Message Generator - Example Configuration
# ===================================================================
# Copy this file to application.yml and modify as needed
# Or use: java -jar message-generator.jar --spring.config.additional-location=file:./config.yml

# Message generator settings
message:
  generator:
    # Enable sample mode - generates one example message and writes to file/console
    sample-mode: false
    # Message generation mode: SCHEMA_BASED or CONSTANT_FILE
    mode: SCHEMA_BASED
    # Path to constant message file (for CONSTANT_FILE mode)
    constant-file:
      message-file-path:
    # Path to schema file (for SCHEMA_BASED mode, default-schema.json used if not set)
    schema-based:
      schema-file-path:

# Spring Kafka configuration
spring:
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Application-specific Kafka settings
kafka:
  topic: messages
  bootstrap-servers: localhost:9092
  # Total number of messages to send
  messages:
    amount: 100
  # Delay in milliseconds between sending messages
  send:
    throttling:
      delay:
        millis: 0
  # Number of threads for sending messages
  threads: 4
  # Client ID for the Kafka producer
  client-id: KafkaMessageGenerator
